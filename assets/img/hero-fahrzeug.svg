<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" aria-hidden="true">
  <defs>
    <linearGradient id="lack" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#333333"/>
      <stop offset="0.35" stop-color="#1a1a1a"/>
      <stop offset="0.75" stop-color="#101010"/>
      <stop offset="1" stop-color="#060606"/>
    </linearGradient>
    <linearGradient id="scheibe" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#585858" stop-opacity=".65"/>
      <stop offset="1" stop-color="#141414" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="kante" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8942e" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#e3bc6a" stop-opacity=".85"/>
      <stop offset="0.62" stop-color="#c8942e" stop-opacity=".55"/>
      <stop offset="1" stop-color="#c8942e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="unterkante" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".35"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="scheinwerfer" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="0.45" stop-color="#f2ddb0" stop-opacity=".6"/>
      <stop offset="1" stop-color="#c8942e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boden" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1c" stop-opacity=".9"/>
      <stop offset="1" stop-color="#060606" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="felge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4a4a"/>
      <stop offset="0.5" stop-color="#1f1f1f"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
  </defs>

  <!-- Nasser Asphalt darunter -->
  <ellipse cx="460" cy="486" rx="352" ry="34" fill="url(#boden)"/>

  <!-- Karosserie: flacher Sportwagen in Seitenansicht -->
  <path d="M108 400
           C 116 368, 150 350, 198 344
           L 272 338
           C 302 336, 320 324, 342 306
           C 374 280, 408 266, 456 264
           L 558 266
           C 612 268, 666 290, 714 316
           C 762 342, 798 364, 814 386
           C 822 398, 816 420, 798 424
           L 722 428
           A 64 64 0 0 0 594 428
           L 316 428
           A 64 64 0 0 0 188 428
           L 126 428
           C 112 424, 106 412, 108 400 Z"
        fill="url(#lack)"/>

  <!-- Seitenscheiben -->
  <path d="M366 306 C 396 284, 424 274, 460 273 L 512 274 L 512 316 L 356 318 Z" fill="url(#scheibe)"/>
  <path d="M534 274 L 556 275 C 600 278, 646 296, 686 318 L 534 318 Z" fill="url(#scheibe)"/>

  <!-- Türfuge und Seitenlinie -->
  <path d="M340 322 L 344 424" stroke="#060606" stroke-opacity=".8" stroke-width="2.5"/>
  <path d="M524 274 L 522 424" stroke="#060606" stroke-opacity=".7" stroke-width="2.5"/>
  <path d="M300 372 C 380 358, 470 352, 560 356 C 640 360, 710 374, 764 392"
        fill="none" stroke="#060606" stroke-opacity=".55" stroke-width="3"/>

  <!-- Seitlicher Lufteinlass -->
  <path d="M556 342 L 636 356 L 632 380 L 552 366 Z" fill="#060606" opacity=".85"/>
  <path d="M562 350 L 628 362" stroke="#c8942e" stroke-opacity=".28" stroke-width="2"/>

  <!-- Scheinwerfer vorn -->
  <path d="M116 372 C 140 360, 168 353, 200 349 L 196 372 C 166 375, 140 381, 120 390 Z" fill="#0d0d0d"/>
  <path d="M124 376 C 146 366, 170 360, 196 357 L 194 368 C 168 371, 144 376, 126 384 Z" fill="#fff9ec" opacity=".9"/>
  <ellipse cx="158" cy="372" rx="92" ry="40" fill="url(#scheinwerfer)" opacity=".4"/>

  <!-- Rückleuchte -->
  <path d="M778 372 C 792 378, 804 386, 812 394 L 802 410 C 792 400, 780 392, 766 386 Z" fill="#0d0d0d"/>
  <path d="M782 380 C 792 385, 800 391, 806 397" stroke="#e3bc6a" stroke-opacity=".7" stroke-width="4" stroke-linecap="round"/>

  <!-- Obere Lichtkante über Haube und Dach -->
  <path d="M120 392 C 132 366, 166 350, 214 344 L 274 338 C 306 334, 324 322, 346 304
           C 378 278, 410 265, 458 264 L 558 266 C 612 268, 668 292, 716 318"
        fill="none" stroke="url(#kante)" stroke-width="3" stroke-linecap="round"/>

  <!-- Schwellerkante -->
  <path d="M190 424 L 314 424 M 596 428 L 726 426"
        stroke="url(#unterkante)" stroke-width="3" stroke-linecap="round"/>

  <!-- Räder -->
  <g>
    <circle cx="252" cy="428" r="60" fill="#080808"/>
    <circle cx="252" cy="428" r="59" fill="none" stroke="#2b2b2b" stroke-width="2"/>
    <circle cx="252" cy="428" r="36" fill="url(#felge)"/>
    <circle cx="252" cy="428" r="36" fill="none" stroke="#c8942e" stroke-opacity=".35" stroke-width="1.5"/>
    <g stroke="#060606" stroke-width="4" stroke-linecap="round">
      <path d="M252 396v64M220 428h64M231 407l42 42M273 407l-42 42"/>
    </g>
    <circle cx="252" cy="428" r="7" fill="#c8942e" opacity=".4"/>
  </g>

  <g>
    <circle cx="658" cy="428" r="60" fill="#080808"/>
    <circle cx="658" cy="428" r="59" fill="none" stroke="#2b2b2b" stroke-width="2"/>
    <circle cx="658" cy="428" r="36" fill="url(#felge)"/>
    <circle cx="658" cy="428" r="36" fill="none" stroke="#c8942e" stroke-opacity=".35" stroke-width="1.5"/>
    <g stroke="#060606" stroke-width="4" stroke-linecap="round">
      <path d="M658 396v64M626 428h64M637 407l42 42M679 407l-42 42"/>
    </g>
    <circle cx="658" cy="428" r="7" fill="#c8942e" opacity=".4"/>
  </g>

  <!-- Außenspiegel -->
  <path d="M360 312 L 336 306 L 334 318 L 358 322 Z" fill="#141414"/>

  <!-- Wassertropfen auf dem Lack -->
  <g fill="#ffffff" opacity=".14">
    <circle cx="270" cy="352" r="2.2"/><circle cx="312" cy="346" r="1.5"/>
    <circle cx="398" cy="340" r="2"/><circle cx="452" cy="336" r="1.4"/>
    <circle cx="506" cy="342" r="2.4"/><circle cx="580" cy="348" r="1.6"/>
    <circle cx="676" cy="368" r="2"/><circle cx="736" cy="386" r="1.5"/>
    <circle cx="222" cy="378" r="1.7"/><circle cx="366" cy="386" r="1.3"/>
    <circle cx="470" cy="392" r="1.9"/><circle cx="592" cy="394" r="1.4"/>
    <circle cx="712" cy="404" r="1.8"/><circle cx="428" cy="300" r="1.3"/>
    <circle cx="486" cy="292" r="1.6"/>
  </g>
</svg>
